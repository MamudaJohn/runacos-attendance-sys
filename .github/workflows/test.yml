name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cabv
          POSTGRES_PASSWORD: cabv_dev_only
          POSTGRES_DB: cabv
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U cabv" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://cabv:cabv_dev_only@localhost:5432/cabv?sslmode=disable
      TEST_DATABASE_URL: postgres://cabv:cabv_dev_only@localhost:5432/cabv?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
