{{template "header" .}}<section class="panel narrow"><p class="eyebrow">Administrator</p><h1>Create an account</h1>{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}{{if .Message}}<p class="success" role="status">{{.Message}}</p>{{end}}<form method="post" action="/admin/users"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Full name<input name="name" maxlength="100" required autocomplete="off"></label><label>Email<input type="email" name="email" maxlength="254" required autocomplete="off"></label><label>Role<select name="role"><option value="student">Student</option><option value="lecturer">Lecturer</option><option value="admin">Administrator</option></select></label><label>Initial password<input type="password" name="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button type="submit">Create account</button></form></section>{{template "footer" .}}
