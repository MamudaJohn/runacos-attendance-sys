{{template "header" .}}<section class="panel narrow"><p class="eyebrow">Your classroom portal</p><h1>Welcome back</h1><p>Use the account provided by your administrator.</p>{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}<form method="post" action="/auth/login"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Email<input type="email" name="email" autocomplete="username" maxlength="254" required></label><label>Password<input type="password" name="password" autocomplete="current-password" maxlength="128" required></label><button type="submit">Sign in</button></form></section>{{template "footer" .}}
